[package]
name = "afterburner-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line interface for the Afterburner AI engine"
license = "MIT OR Apache-2.0"

[dependencies]
afterburner = { path = "../.." }
burn = "0.19"
burn-autodiff = "0.19"
burn-cuda = { version = "0.19", optional = true }
burn-ndarray = "0.19"
burn-optim = "0.19"
candle-core = "0.9"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
cuda = ["dep:burn-cuda", "afterburner/cuda"]

