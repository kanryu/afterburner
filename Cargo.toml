[package]
name = "afterburner"
version = "0.1.0"
edition = "2024"
description = "A Burn-based AI execution engine for training and running LoRA models"
license = "MIT OR Apache-2.0"

[workspace]
members = ["crates/afterburner-cli"]
resolver = "2"

[patch.crates-io]
# Afterburner needs memory-bound MatMul recomputation for long DiT graphs.
# Burn 0.19 does not expose this hook from the published crate, so the
# narrowly-scoped local fork is used by both the library and CLI.
burn-autodiff = { path = "vendor/burn-autodiff" }
# Keep transient CUDA workspaces out of CubeCL's persistent model-weight pool.
cubecl-runtime = { path = "vendor/cubecl-runtime" }
burn-optim = { path = "vendor/burn-optim" }

[lib]
name = "afterburner"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Burn runtime and the crates used by the planned training/inference stack.
burn = "0.19"
burn-core = "0.19"
burn-nn = "0.19"
burn-autodiff = "0.19"
burn-optim = "0.19"
burn-train = "0.19"
burn-dataset = "0.19"
burn-store = "0.19"
burn-cuda = { version = "0.19", optional = true }
burn-ndarray = "0.19"
cubecl-core = { version = "0.8.1", optional = true }
cubecl-cuda = { version = "0.8.1", optional = true }
cubecl-runtime = { version = "0.8.1", optional = true }
burn-fusion = "0.19"

# Candle is retained initially as the migration source and numerical oracle.
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
image = "0.25"
safetensors = "0.7"
half = "2.7"
memmap2 = "0.9"
tokenizers = "0.21"

[features]
default = []
checkpointing = []
bf16 = []
f16 = []
vulkan = ["burn/vulkan"]
cuda = [
    "dep:burn-cuda",
    "dep:cubecl-core",
    "dep:cubecl-cuda",
]
# Enable Candle's CUDA kernels only when GPU preprocessing is requested.
# Burn CUDA training does not require this feature when reading AFBCACHE.
candle-cuda = [
    "candle-core/cuda",
    "candle-transformers/cuda",
]
# Use CubeCL's exclusive-page pools instead of sub-slice pools for long
# training runs. This reduces fragmentation and makes allocator growth easier
# to bound on CUDA devices.
fixed-memory = [
    "dep:cubecl-runtime",
    "cubecl-runtime/exclusive-memory-only",
]

